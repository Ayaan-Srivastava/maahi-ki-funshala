<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Coding Quiz - Maahi Ki Funshala</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #fff8f0;
            color: #333;
        }

        nav {
            background: #ff6b6b;
            padding: 15px 8%;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav h2 {
            color: white;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        .page {
            max-width: 850px;
            margin: 45px auto;
            padding: 20px;
        }

        .title {
            text-align: center;
            color: #ff6b6b;
            margin-bottom: 30px;
        }

        .quiz-box {
            background: white;
            padding: 30px;
            border-radius: 20px;

            box-shadow:
                0 8px 25px rgba(0,0,0,0.1);
        }

        .languages {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-bottom: 25px;
        }

        .language-btn {
            padding: 13px 8px;
            border: 2px solid #eee;
            border-radius: 12px;
            background: white;
            cursor: pointer;
            font-weight: bold;
        }

        .language-btn:hover,
        .language-btn.active {
            background: #ff6b6b;
            color: white;
            border-color: #ff6b6b;
        }

        .top {
            display: flex;
            justify-content: space-between;
            color: #ff6b6b;
            font-weight: bold;
            margin-bottom: 25px;
        }

        #question {
            line-height: 1.5;
            margin-bottom: 20px;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option {
            padding: 15px;
            border: 2px solid #eee;
            background: white;
            border-radius: 12px;
            text-align: left;
            cursor: pointer;
            font-size: 16px;
        }

        .option:hover {
            background: #fff1e6;
            border-color: #ff6b6b;
        }

        .correct {
            background: #d4edda !important;
            border-color: #28a745 !important;
        }

        .wrong {
            background: #f8d7da !important;
            border-color: #dc3545 !important;
        }

        .btn {
            margin-top: 25px;
            padding: 13px 25px;
            border: none;
            border-radius: 25px;
            background: #ff6b6b;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        .result {
            text-align: center;
        }

        .result h2 {
            color: #ff6b6b;
            margin-bottom: 15px;
        }

        @media(max-width: 700px) {

            nav {
                flex-direction: column;
                gap: 12px;
                text-align: center;
            }

            .page {
                margin: 25px auto;
                padding: 15px;
            }

            .quiz-box {
                padding: 20px;
            }

            .languages {
                grid-template-columns: repeat(2, 1fr);
            }

            .top {
                flex-direction: column;
                gap: 10px;
                text-align: center;
            }

            #question {
                font-size: 19px;
            }

            .option {
                font-size: 15px;
            }
        }

    </style>
</head>

<body>

<nav>

    <h2>🌈 Maahi Ki Funshala</h2>

    <a href="games.html">
        🎮 Back to Games
    </a>

</nav>


<div class="page">

    <h1 class="title">
        💻 Coding Quiz
    </h1>

    <div class="quiz-box" id="quizBox">

        <div id="languageSelection">

            <h2 style="text-align:center; margin-bottom:10px;">
                👨‍💻 Choose Programming Language
            </h2>

            <p style="text-align:center; margin-bottom:20px;">
                Test your programming knowledge!
            </p>

            <div class="languages">

                <button class="language-btn"
                    onclick="selectLanguage('Python',this)">
                    🐍 Python
                </button>

                <button class="language-btn"
                    onclick="selectLanguage('C',this)">
                    🔵 C
                </button>

                <button class="language-btn"
                    onclick="selectLanguage('C++',this)">
                    🟣 C++
                </button>

                <button class="language-btn"
                    onclick="selectLanguage('Java',this)">
                    ☕ Java
                </button>

                <button class="language-btn"
                    onclick="selectLanguage('JavaScript',this)">
                    🟨 JavaScript
                </button>

                <button class="language-btn"
                    onclick="selectLanguage('HTML',this)">
                    🌐 HTML
                </button>

                <button class="language-btn"
                    onclick="selectLanguage('CSS',this)">
                    🎨 CSS
                </button>

            </div>

            <div style="text-align:center;">

                <button class="btn"
                    onclick="startCodingQuiz()">
                    🚀 Start Quiz
                </button>

            </div>

        </div>


        <div id="quizArea" style="display:none;">

            <div class="top">

                <span id="questionNumber">
                    Question 1 / 10
                </span>

                <span id="score">
                    Score: 0
                </span>

            </div>

            <h2 id="question"></h2>

            <div class="options" id="options"></div>

            <button
                class="btn"
                id="nextBtn"
                onclick="nextQuestion()"
                style="display:none;">

                Next Question ➡️

            </button>

        </div>

    </div>

</div>


<script>

const codingQuestions = {

Python: [
    {
        q:"Which symbol is used for comments in Python?",
        o:["//","#","/*","--"],
        a:"#"
    },
    {
        q:"Which keyword is used to define a function in Python?",
        o:["function","def","fun","define"],
        a:"def"
    },
    {
        q:"Which data type stores True or False?",
        o:["int","str","bool","float"],
        a:"bool"
    },
    {
        q:"Which symbol is used for exponent in Python?",
        o:["^","**","//","%%"],
        a:"**"
    },
    {
        q:"Which brackets are used for a list?",
        o:["()","{}","[]","<>"],
        a:"[]"
    }
],

C: [
    {
        q:"Which symbol is used to end a statement in C?",
        o:[".",":",";","!"],
        a:";"
    },
    {
        q:"Which function is the starting point of a C program?",
        o:["start()","main()","run()","begin()"],
        a:"main()"
    },
    {
        q:"Which header is used for printf()?",
        o:["stdio.h","math.h","string.h","stdlib"],
        a:"stdio.h"
    },
    {
        q:"Which data type stores integers?",
        o:["float","char","int","double"],
        a:"int"
    },
    {
        q:"Which operator is used for assignment?",
        o:["==","=","!=","<="],
        a:"="
    }
],

"C++": [
    {
        q:"Which extension is commonly used for C++ files?",
        o:[".py",".cpp",".java",".html"],
        a:".cpp"
    },
    {
        q:"Which keyword is used for a class in C++?",
        o:["object","class","structs","define"],
        a:"class"
    },
    {
        q:"Which operator is used with cout?",
        o:["<<",">>","::","&&"],
        a:"<<"
    },
    {
        q:"Which function is the entry point of C++?",
        o:["start()","main()","run()","execute()"],
        a:"main()"
    },
    {
        q:"Which language is C++ based on?",
        o:["C","Python","Java","HTML"],
        a:"C"
    }
],

Java: [
    {
        q:"Which keyword creates a class in Java?",
        o:["class","Class","define","newclass"],
        a:"class"
    },
    {
        q:"Which method is the entry point of Java?",
        o:["start()","main()","run()","execute()"],
        a:"main()"
    },
    {
        q:"Which keyword creates an object?",
        o:["create","object","new","make"],
        a:"new"
    },
    {
        q:"Which data type stores whole numbers?",
        o:["String","int","boolean","double"],
        a:"int"
    },
    {
        q:"Java is mainly a ______ language.",
        o:["Markup","Programming","Styling","Query"],
        a:"Programming"
    }
],

JavaScript: [
    {
        q:"Which keyword declares a variable?",
        o:["var","variable","define","letvar"],
        a:"var"
    },
    {
        q:"Which symbol is used for single-line comments?",
        o:["#","//","<!--","--"],
        a:"//"
    },
    {
        q:"Which method prints output in console?",
        o:["print()","console.log()","display()","write()"],
        a:"console.log()"
    },
    {
        q:"JavaScript mainly runs in the ______.",
        o:["Browser","Compiler only","Database","BIOS"],
        a:"Browser"
    },
    {
        q:"Which keyword creates a constant?",
        o:["constant","const","fixed","static"],
        a:"const"
    }
],

HTML: [
    {
        q:"What does HTML stand for?",
        o:[
            "Hyper Text Markup Language",
            "High Text Machine Language",
            "Hyper Tool Markup Language",
            "Home Tool Markup Language"
        ],
        a:"Hyper Text Markup Language"
    },
    {
        q:"Which tag creates a heading?",
        o:["<p>","<h1>","<head>","<title>"],
        a:"<h1>"
    },
    {
        q:"Which tag creates a paragraph?",
        o:["<p>","<para>","<text>","<pg>"],
        a:"<p>"
    },
    {
        q:"Which tag creates a link?",
        o:["<link>","<a>","<href>","<url>"],
        a:"<a>"
    },
    {
        q:"Which tag is used to insert an image?",
        o:["<pic>","<image>","<img>","<src>"],
        a:"<img>"
    }
],

CSS: [
    {
        q:"What does CSS stand for?",
        o:[
            "Computer Style Sheets",
            "Cascading Style Sheets",
            "Creative Style System",
            "Colorful Style Sheets"
        ],
        a:"Cascading Style Sheets"
    },
    {
        q:"Which property changes text color?",
        o:["font","color","text-color","background"],
        a:"color"
    },
    {
        q:"Which property changes background color?",
        o:["bgcolor","background-color","color","background-style"],
        a:"background-color"
    },
    {
        q:"Which symbol selects a class?",
        o:["#",".","@","&"],
        a:"."
    },
    {
        q:"Which property changes font size?",
        o:["text-size","font-size","size","font"],
        a:"font-size"
    }
]

};


let selectedLanguage = "";
let questions = [];
let current = 0;
let score = 0;


function selectLanguage(language,button){

    selectedLanguage = language;

    document.querySelectorAll(".language-btn")
    .forEach(btn => btn.classList.remove("active"));

    button.classList.add("active");
}


function startCodingQuiz(){

    if(selectedLanguage === ""){
        alert("Please select a language first! 👨‍💻");
        return;
    }

    questions = [...codingQuestions[selectedLanguage]];

    questions.sort(() => Math.random() - 0.5);

    current = 0;
    score = 0;

    document.getElementById("languageSelection")
    .style.display = "none";

    document.getElementById("quizArea")
    .style.display = "block";

    showQuestion();
}


function showQuestion(){

    let q = questions[current];

    document.getElementById("questionNumber")
    .innerText =
    `Question ${current + 1} / ${questions.length}`;

    document.getElementById("score")
    .innerText = `Score: ${score}`;

    document.getElementById("question")
    .innerText = q.q;

    let options = document.getElementById("options");

    options.innerHTML = "";

    q.o.forEach(option => {

        let btn = document.createElement("button");

        btn.className = "option";
        btn.innerText = option;

        btn.onclick = () =>
            checkAnswer(btn,option);

        options.appendChild(btn);
    });

    document.getElementById("nextBtn")
    .style.display = "none";
}


function checkAnswer(button,answer){

    let q = questions[current];

    document.querySelectorAll(".option")
    .forEach(btn => btn.disabled = true);

    if(answer === q.a){

        button.classList.add("correct");

        score++;

        document.getElementById("score")
        .innerText = `Score: ${score}`;

    } else {

        button.classList.add("wrong");

        document.querySelectorAll(".option")
        .forEach(btn => {

            if(btn.innerText === q.a)
                btn.classList.add("correct");

        });
    }

    if(current === questions.length - 1){

        document.getElementById("nextBtn")
        .innerText = "✅ Submit Quiz";

    } else {

        document.getElementById("nextBtn")
        .innerText = "Next Question ➡️";

    }

    document.getElementById("nextBtn")
    .style.display = "inline-block";
}


function nextQuestion(){

    if(current === questions.length - 1){

        showResult();
        return;
    }

    current++;
    showQuestion();
}


function showResult(){

    let percentage =
        Math.round((score / questions.length) * 100);

    document.getElementById("quizBox").innerHTML = `

        <div class="result">

            <h2>🎉 Coding Quiz Completed!</h2>

            <h3>${selectedLanguage}</h3>

            <h2>${score} / ${questions.length}</h2>

            <p>Your Score: ${percentage}%</p>

            <button class="btn"
                onclick="location.reload()">
                🔄 Play Again
            </button>

        </div>

    `;
}

</script>

</body>
</html>
