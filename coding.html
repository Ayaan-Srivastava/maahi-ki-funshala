<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Coding Quiz - Maahi Ki Funshala</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:
        radial-gradient(
            circle at top left,
            rgba(139,92,246,.15),
            transparent 35%
        ),
        radial-gradient(
            circle at bottom right,
            rgba(236,72,153,.10),
            transparent 35%
        ),
        #0b0b12;

    color:#f5f5f7;
    min-height:100vh;
}

/* ================= NAVBAR ================= */

nav{
    background:rgba(17,17,26,.95);

    border-bottom:1px solid rgba(139,92,246,.25);

    padding:15px 8%;

    display:flex;
    justify-content:space-between;
    align-items:center;

    box-shadow:0 5px 25px rgba(0,0,0,.35);
}

nav h2{
    color:#ffffff;
}

nav a{
    color:#c4b5fd;

    text-decoration:none;

    font-weight:bold;

    transition:.3s;
}

nav a:hover{
    color:#f472b6;
}

/* ================= PAGE ================= */

.page{
    max-width:850px;

    margin:45px auto;

    padding:20px;
}

/* ================= TITLE ================= */

.title{
    text-align:center;

    color:#f472b6;

    margin-bottom:30px;

    text-shadow:
        0 0 18px rgba(244,114,182,.35);
}

/* ================= QUIZ BOX ================= */

.quiz-box{
    background:rgba(20,20,30,.92);

    padding:30px;

    border-radius:20px;

    border:1px solid rgba(139,92,246,.25);

    box-shadow:
        0 10px 35px rgba(0,0,0,.5),
        0 0 30px rgba(139,92,246,.08);

    backdrop-filter:blur(10px);
}

/* ================= LANGUAGE ================= */

#languageSelection h2{
    color:#f5f5f7;
}

#languageSelection > p{
    color:#a1a1aa;
}

.languages{
    display:grid;

    grid-template-columns:repeat(4,1fr);

    gap:12px;

    margin-bottom:25px;
}

.language-btn{
    padding:13px 8px;

    border:2px solid #29293a;

    border-radius:12px;

    background:#11111a;

    color:#d4d4d8;

    cursor:pointer;

    font-weight:bold;

    transition:.25s;
}

.language-btn:hover,
.language-btn.active{

    background:linear-gradient(
        135deg,
        #8b5cf6,
        #ec4899
    );

    color:white;

    border-color:transparent;

    box-shadow:
        0 5px 18px rgba(139,92,246,.25);

    transform:translateY(-2px);
}

/* ================= TOP ================= */

.top{
    display:flex;

    justify-content:space-between;

    color:#c4b5fd;

    font-weight:bold;

    margin-bottom:25px;
}

#score{
    color:#f472b6;
}

/* ================= QUESTION ================= */

#question{
    line-height:1.5;

    margin-bottom:20px;

    color:#f4f4f5;

    text-shadow:
        0 0 8px rgba(167,139,250,.12);
}

/* ================= OPTIONS ================= */

.options{
    display:flex;

    flex-direction:column;

    gap:12px;
}

.option{
    padding:15px;

    border:2px solid #29293a;

    background:#11111a;

    color:#e4e4e7;

    border-radius:12px;

    text-align:left;

    cursor:pointer;

    font-size:16px;

    transition:.2s;
}

.option:hover:not(:disabled){

    background:#191927;

    border-color:#8b5cf6;

    transform:translateX(3px);

    box-shadow:
        0 5px 15px rgba(139,92,246,.12);
}

.option.correct{

    background:rgba(34,197,94,.15) !important;

    border-color:#22c55e !important;

    color:#86efac !important;

    box-shadow:
        0 0 15px rgba(34,197,94,.15);
}

.option.wrong{

    background:rgba(239,68,68,.15) !important;

    border-color:#ef4444 !important;

    color:#fca5a5 !important;

    box-shadow:
        0 0 15px rgba(239,68,68,.12);
}

.option:disabled{
    cursor:not-allowed;
}

/* ================= AUTO NEXT ================= */

.auto-next{
    text-align:center;

    margin-top:20px;

    color:#a1a1aa;

    font-size:14px;

    min-height:20px;
}

/* ================= BUTTON ================= */

.btn{
    margin-top:25px;

    padding:13px 25px;

    border:none;

    border-radius:25px;

    background:linear-gradient(
        135deg,
        #8b5cf6,
        #ec4899
    );

    color:white;

    font-weight:bold;

    cursor:pointer;

    transition:.25s;

    box-shadow:
        0 5px 15px rgba(139,92,246,.25);
}

.btn:hover{

    transform:translateY(-2px);

    box-shadow:
        0 8px 22px rgba(236,72,153,.3);
}

.btn:active{
    transform:scale(.97);
}

/* ================= RESULT ================= */

.result{
    text-align:center;
}

.result h2{
    color:#f472b6;

    margin-bottom:15px;

    text-shadow:
        0 0 12px rgba(244,114,182,.3);
}

.result h3{
    color:#a78bfa;

    margin-bottom:15px;
}

.result p{
    margin:10px;

    font-size:17px;

    color:#a1a1aa;
}

/* ================= MOBILE ================= */

@media(max-width:700px){

    nav{
        flex-direction:column;

        gap:12px;

        text-align:center;
    }

    .page{
        margin:25px auto;

        padding:15px;
    }

    .quiz-box{
        padding:20px;
    }

    .languages{
        grid-template-columns:repeat(2,1fr);
    }

    .top{
        flex-direction:column;

        gap:10px;

        text-align:center;
    }

    #question{
        font-size:19px;
    }

    .option{
        font-size:15px;
    }

    .btn{
        width:100%;
    }

}

</style>

</head>

<body>


<!-- NAVBAR -->

<nav>

    <h2>🌈 Maahi Ki Funshala</h2>

    <a href="games.html">
        🎮 Back to Games
    </a>

</nav>


<!-- PAGE -->

<div class="page">

    <h1 class="title">
        💻 Coding Quiz
    </h1>


    <div class="quiz-box" id="quizBox">


        <!-- LANGUAGE SELECTION -->

        <div id="languageSelection">

            <h2 style="text-align:center;margin-bottom:10px;">
                👨‍💻 Choose Programming Language
            </h2>

            <p style="text-align:center;margin-bottom:20px;">
                Test your programming knowledge!
            </p>


            <div class="languages">

                <button
                    class="language-btn"
                    onclick="selectLanguage('Python',this)">
                    🐍 Python
                </button>

                <button
                    class="language-btn"
                    onclick="selectLanguage('C',this)">
                    🔵 C
                </button>

                <button
                    class="language-btn"
                    onclick="selectLanguage('C++',this)">
                    🟣 C++
                </button>

                <button
                    class="language-btn"
                    onclick="selectLanguage('Java',this)">
                    ☕ Java
                </button>

                <button
                    class="language-btn"
                    onclick="selectLanguage('JavaScript',this)">
                    🟨 JavaScript
                </button>

                <button
                    class="language-btn"
                    onclick="selectLanguage('HTML',this)">
                    🌐 HTML
                </button>

                <button
                    class="language-btn"
                    onclick="selectLanguage('CSS',this)">
                    🎨 CSS
                </button>

            </div>


            <div style="text-align:center;">

                <button
                    class="btn"
                    onclick="startCodingQuiz()">

                    🚀 Start Quiz

                </button>

            </div>

        </div>


        <!-- QUIZ AREA -->

        <div
            id="quizArea"
            style="display:none;">

            <div class="top">

                <span id="questionNumber">
                    Question 1 / 5
                </span>

                <span id="score">
                    Score: 0
                </span>

            </div>


            <h2 id="question"></h2>


            <div
                class="options"
                id="options">
            </div>


            <div
                class="auto-next"
                id="autoNext">
            </div>

        </div>

    </div>

</div>


<script>

/* =====================================================
   QUESTIONS
===================================================== */

const codingQuestions = {

Python: [

    {
        q:"Which symbol is used for comments in Python?",
        o:["//","#","/*","--"],
        a:"#"
    },

    {
        q:"Which keyword is used to define a function in Python?",
        o:["function","def","fun","define"],
        a:"def"
    },

    {
        q:"Which data type stores True or False?",
        o:["int","str","bool","float"],
        a:"bool"
    },

    {
        q:"Which symbol is used for exponent in Python?",
        o:["^","**","//","%%"],
        a:"**"
    },

    {
        q:"Which brackets are used for a list?",
        o:["()","{}","[]","<>"],
        a:"[]"
    }

],

C: [

    {
        q:"Which symbol is used to end a statement in C?",
        o:[".",":",";","!"],
        a:";"
    },

    {
        q:"Which function is the starting point of a C program?",
        o:["start()","main()","run()","begin()"],
        a:"main()"
    },

    {
        q:"Which header is used for printf()?",
        o:["stdio.h","math.h","string.h","stdlib"],
        a:"stdio.h"
    },

    {
        q:"Which data type stores integers?",
        o:["float","char","int","double"],
        a:"int"
    },

    {
        q:"Which operator is used for assignment?",
        o:["==","=","!=","<="],
        a:"="
    }

],

"C++": [

    {
        q:"Which extension is commonly used for C++ files?",
        o:[".py",".cpp",".java",".html"],
        a:".cpp"
    },

    {
        q:"Which keyword is used for a class in C++?",
        o:["object","class","structs","define"],
        a:"class"
    },

    {
        q:"Which operator is used with cout?",
        o:["<<",">>","::","&&"],
        a:"<<"
    },

    {
        q:"Which function is the entry point of C++?",
        o:["start()","main()","run()","execute()"],
        a:"main()"
    },

    {
        q:"Which language is C++ based on?",
        o:["C","Python","Java","HTML"],
        a:"C"
    }

],

Java: [

    {
        q:"Which keyword creates a class in Java?",
        o:["class","Class","define","newclass"],
        a:"class"
    },

    {
        q:"Which method is the entry point of Java?",
        o:["start()","main()","run()","execute()"],
        a:"main()"
    },

    {
        q:"Which keyword creates an object?",
        o:["create","object","new","make"],
        a:"new"
    },

    {
        q:"Which data type stores whole numbers?",
        o:["String","int","boolean","double"],
        a:"int"
    },

    {
        q:"Java is mainly a ______ language.",
        o:["Markup","Programming","Styling","Query"],
        a:"Programming"
    }

],

JavaScript: [

    {
        q:"Which keyword declares a variable?",
        o:["var","variable","define","letvar"],
        a:"var"
    },

    {
        q:"Which symbol is used for single-line comments?",
        o:["#","//","<!--","--"],
        a:"//"
    },

    {
        q:"Which method prints output in console?",
        o:["print()","console.log()","display()","write()"],
        a:"console.log()"
    },

    {
        q:"JavaScript mainly runs in the ______.",
        o:["Browser","Compiler only","Database","BIOS"],
        a:"Browser"
    },

    {
        q:"Which keyword creates a constant?",
        o:["constant","const","fixed","static"],
        a:"const"
    }

],

HTML: [

    {
        q:"What does HTML stand for?",
        o:[
            "Hyper Text Markup Language",
            "High Text Machine Language",
            "Hyper Tool Markup Language",
            "Home Tool Markup Language"
        ],
        a:"Hyper Text Markup Language"
    },

    {
        q:"Which tag creates a heading?",
        o:["<p>","<h1>","<head>","<title>"],
        a:"<h1>"
    },

    {
        q:"Which tag creates a paragraph?",
        o:["<p>","<para>","<text>","<pg>"],
        a:"<p>"
    },

    {
        q:"Which tag creates a link?",
        o:["<link>","<a>","<href>","<url>"],
        a:"<a>"
    },

    {
        q:"Which tag is used to insert an image?",
        o:["<pic>","<image>","<img>","<src>"],
        a:"<img>"
    }

],

CSS: [

    {
        q:"What does CSS stand for?",
        o:[
            "Computer Style Sheets",
            "Cascading Style Sheets",
            "Creative Style System",
            "Colorful Style Sheets"
        ],
        a:"Cascading Style Sheets"
    },

    {
        q:"Which property changes text color?",
        o:["font","color","text-color","background"],
        a:"color"
    },

    {
        q:"Which property changes background color?",
        o:[
            "bgcolor",
            "background-color",
            "color",
            "background-style"
        ],
        a:"background-color"
    },

    {
        q:"Which symbol selects a class?",
        o:["#",".","@","&"],
        a:"."
    },

    {
        q:"Which property changes font size?",
        o:["text-size","font-size","size","font"],
        a:"font-size"
    }

]

};


let selectedLanguage = "";

let questions = [];

let current = 0;

let score = 0;

let autoNextTimer;


function selectLanguage(language,button){

    selectedLanguage = language;

    document
        .querySelectorAll(".language-btn")
        .forEach(btn =>
            btn.classList.remove("active")
        );

    button.classList.add("active");
}


function startCodingQuiz(){

    if(selectedLanguage === ""){

        alert(
            "Please select a language first! 👨‍💻"
        );

        return;
    }

    questions =
        [...codingQuestions[selectedLanguage]];

    questions.sort(
        () => Math.random() - 0.5
    );

    current = 0;

    score = 0;

    document
        .getElementById("languageSelection")
        .style.display = "none";

    document
        .getElementById("quizArea")
        .style.display = "block";

    showQuestion();
}


function showQuestion(){

    clearTimeout(autoNextTimer);

    let q = questions[current];

    document
        .getElementById("questionNumber")
        .innerText =
        `Question ${current + 1} / ${questions.length}`;

    document
        .getElementById("score")
        .innerText =
        `Score: ${score}`;

    document
        .getElementById("question")
        .innerText = q.q;

    let options =
        document.getElementById("options");

    options.innerHTML = "";

    document
        .getElementById("autoNext")
        .innerText = "";

    let shuffledOptions =
        [...q.o].sort(
            () => Math.random() - 0.5
        );

    shuffledOptions.forEach(option => {

        let btn =
            document.createElement("button");

        btn.className = "option";

        btn.innerText = option;

        btn.onclick = () =>
            checkAnswer(btn, option);

        options.appendChild(btn);

    });

}


function checkAnswer(button,answer){

    document
        .querySelectorAll(".option")
        .forEach(btn =>
            btn.disabled = true
        );

    let q = questions[current];

    if(answer === q.a){

        button.classList.add("correct");

        score++;

        document
            .getElementById("score")
            .innerText =
            `Score: ${score}`;

    }

    else{

        button.classList.add("wrong");

        document
            .querySelectorAll(".option")
            .forEach(btn => {

                if(btn.innerText === q.a){

                    btn.classList.add("correct");

                }

            });

    }

    let seconds = 3;

    document
        .getElementById("autoNext")
        .innerText =
        `⏳ Next question in ${seconds}...`;

    let countdown =
        setInterval(() => {

            seconds--;

            if(seconds > 0){

                document
                    .getElementById("autoNext")
                    .innerText =
                    `⏳ Next question in ${seconds}...`;

            }

        },1000);

    autoNextTimer =
        setTimeout(() => {

            clearInterval(countdown);

            if(current === questions.length - 1){

                showResult();

            }

            else{

                current++;

                showQuestion();

            }

        },3000);

}


function showResult(){

    clearTimeout(autoNextTimer);

    let percentage =
        Math.round(
            (score / questions.length) * 100
        );

    let resultMessage;

    if(percentage === 100){

        resultMessage =
            "🏆 Perfect Score! Amazing!";

    }

    else if(percentage >= 80){

        resultMessage =
            "🎉 Excellent Work!";

    }

    else if(percentage >= 60){

        resultMessage =
            "👏 Great Job!";

    }

    else if(percentage >= 40){

        resultMessage =
            "👍 Good attempt! Keep learning!";

    }

    else{

        resultMessage =
            "💪 Keep practicing! You can do better!";

    }

    document
        .getElementById("quizBox")
        .innerHTML = `

            <div class="result">

                <h2>
                    🎉 Coding Quiz Completed!
                </h2>

                <h3>
                    ${selectedLanguage}
                </h3>

                <h2>
                    ${score} / ${questions.length}
                </h2>

                <p>
                    Your Score: ${percentage}%
                </p>

                <p>
                    ${resultMessage}
                </p>

                <button
                    class="btn"
                    onclick="location.reload()">

                    🔄 Play Again

                </button>

            </div>

        `;

}

</script>

</body>

</html>
