<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Student Quiz - Maahi Ki Funshala</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #fff8f0;
            color: #333;
        }

        /* ================= NAVBAR ================= */

        nav {
            background: #ff6b6b;
            padding: 15px 8%;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav h2 {
            color: white;
        }

        .nav-links {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        nav a:hover {
            color: #ffe66d;
        }

        /* ================= PAGE ================= */

        .page {
            max-width: 800px;
            margin: 60px auto;
            padding: 20px;
        }

        .title {
            text-align: center;
            color: #ff6b6b;
            margin-bottom: 30px;
        }

        /* ================= QUIZ BOX ================= */

        .quiz-box {
            background: white;
            padding: 35px;
            border-radius: 20px;

            box-shadow:
                0 8px 25px
                rgba(0,0,0,0.1);
        }

        /* ================= SUBJECT ================= */

        .subject-selection {
            text-align: center;
        }

        .subject-selection h2 {
            color: #ff6b6b;
            margin-bottom: 10px;
        }

        .subject-selection p {
            color: #666;
            margin-bottom: 25px;
        }

        .subjects {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .subject-btn {
            padding: 18px;

            border: 2px solid #eee;

            background: white;

            border-radius: 15px;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;

            color: #444;
        }

        .subject-btn:hover {
            background: #fff1e6;
            border-color: #ff6b6b;
            transform: translateY(-2px);
        }

        /* ================= SCIENCE LEVEL ================= */

        #scienceLevelSelection {
            display: none;

            margin-top: 25px;

            padding: 20px;

            background: #fff8f0;

            border-radius: 15px;
        }

        #scienceLevelSelection h3 {
            color: #ff6b6b;
            margin-bottom: 15px;
        }

        .science-levels {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .level-btn {
            padding: 12px 20px;

            border: 2px solid #eee;

            border-radius: 25px;

            background: white;

            color: #444;

            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;
        }

        .level-btn:hover {
            border-color: #ff6b6b;
            background: #fff1e6;
        }

        /* ================= QUIZ AREA ================= */

        .top {
            display: flex;

            justify-content: space-between;

            color: #ff6b6b;

            font-weight: bold;

            margin-bottom: 25px;
        }

        .subject-label {
            text-align: center;

            margin-bottom: 20px;

            color: #ff9f43;

            font-weight: bold;
        }

        #question {
            margin-bottom: 25px;
            line-height: 1.5;
        }

        #options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option {
            padding: 15px;

            border: 2px solid #eee;

            background: white;

            border-radius: 12px;

            text-align: left;

            cursor: pointer;

            font-size: 16px;

            transition: 0.2s;
        }

        .option:hover {
            background: #fff1e6;
            border-color: #ff6b6b;
        }

        .option.correct {
            background: #d4edda;
            border-color: #28a745;
            color: #155724;
        }

        .option.wrong {
            background: #f8d7da;
            border-color: #dc3545;
            color: #721c24;
        }

        .option:disabled {
            cursor: not-allowed;
        }

        /* ================= BUTTONS ================= */

        .quiz-buttons {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .btn {
            margin-top: 25px;

            padding: 13px 25px;

            border: none;

            border-radius: 25px;

            background: #ff6b6b;

            color: white;

            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;
        }

        .btn:hover {
            background: #ff5252;
            transform: translateY(-2px);
        }

        #quizSubmitBtn {
            background: #28a745;
            display: none;
        }

        #quizSubmitBtn:hover {
            background: #218838;
        }

        /* ================= RESULT ================= */

        .result {
            text-align: center;
        }

        .result h2 {
            color: #ff6b6b;
            margin: 15px;
        }

        .result-card {
            background: #fff8f0;

            padding: 25px;

            border-radius: 15px;

            margin: 20px 0;
        }

        .result-card p {
            margin: 10px;
            font-size: 17px;
        }

        .result-score {
            font-size: 35px;

            font-weight: bold;

            color: #ff6b6b;

            margin: 15px;
        }

        .result-buttons {
            display: flex;

            justify-content: center;

            gap: 12px;

            flex-wrap: wrap;
        }

        /* ================= MOBILE ================= */

        @media(max-width:700px) {

            nav {
                flex-direction: column;
                gap: 12px;
                text-align: center;
            }

            .nav-links {
                flex-direction: column;
                gap: 10px;
            }

            .page {
                margin: 30px auto;
                padding: 15px;
            }

            .quiz-box {
                padding: 20px;
            }

            .subjects {
                grid-template-columns: 1fr;
            }

            .top {
                flex-direction: column;
                gap: 10px;
                text-align: center;
            }

            .science-levels {
                flex-direction: column;
            }

            .level-btn {
                width: 100%;
            }

            #question {
                font-size: 19px;
            }

            .option {
                font-size: 15px;
            }

            .btn {
                width: 100%;
            }

        }

    </style>

</head>


<body>


<!-- ================= NAVBAR ================= -->

<nav>

    <h2>
        🌈 Maahi Ki Funshala
    </h2>

    <div class="nav-links">

        <a href="index.html">
            🏠 Home
        </a>

        <a href="games.html">
            🎮 Games
        </a>

    </div>

</nav>


<!-- ================= PAGE ================= -->

<div class="page">

    <h1 class="title">
        🧠 Student Quiz
    </h1>


    <div class="quiz-box">


        <!-- ================= SUBJECT SELECTION ================= -->

        <div
            class="subject-selection"
            id="subjectSelection">

            <h2>
                📚 Choose Your Subject
            </h2>

            <p>
                Select a subject and start your quiz!
            </p>


            <div class="subjects">


                <button
                    class="subject-btn"
                    onclick="selectSubject('English')">

                    📘 English
                    <small>(Grammar)</small>

                </button>


                <button
                    class="subject-btn"
                    onclick="selectSubject('Hindi')">

                    🪔 Hindi

                </button>


                <button
                    class="subject-btn"
                    onclick="selectSubject('Mathematics')">

                    🔢 Mathematics

                </button>


                <button
                    class="subject-btn"
                    onclick="selectSubject('Science')">

                    🔬 Science

                </button>


                <button
                    class="subject-btn"
                    onclick="selectSubject('Social Science')">

                    🌍 Social Science

                </button>


                <button
                    class="subject-btn"
                    onclick="selectSubject('General Studies')">

                    🌐 General Studies (GS)

                </button>


            </div>


            <!-- ================= SCIENCE LEVEL ================= -->

            <div id="scienceLevelSelection">

                <h3>
                    🔬 Choose Science Level
                </h3>

                <div class="science-levels">

                    <button
                        class="level-btn"
                        onclick="selectScienceLevel('Easy')">

                        🟢 Easy

                    </button>

                    <button
                        class="level-btn"
                        onclick="selectScienceLevel('Medium')">

                        🟡 Medium

                    </button>

                    <button
                        class="level-btn"
                        onclick="selectScienceLevel('Hard')">

                        🔴 Hard

                    </button>

                </div>

            </div>

        </div>


        <!-- ================= QUIZ AREA ================= -->

        <div
            id="quizArea"
            style="display:none;">

            <div
                class="subject-label"
                id="quizSubject">

                📚 Quiz

            </div>


            <div class="top">

                <span id="questionNumber">
                    Question 1 / 10
                </span>

                <span id="score">
                    Score: 0
                </span>

            </div>


            <h2 id="question">
                Loading...
            </h2>


            <div id="options"></div>


            <div class="quiz-buttons">

                <button
                    class="btn"
                    id="nextBtn"
                    onclick="nextQuestion()"
                    style="display:none;">

                    Next Question ➡️

                </button>


                <button
                    class="btn"
                    id="quizSubmitBtn"
                    onclick="submitQuiz()">

                    ✅ Submit Quiz

                </button>

            </div>

        </div>


    </div>

</div>


<script src="script.js"></script>

</body>

</html>
