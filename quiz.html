<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Student Quiz - Maahi Ki Funshala</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #fff8f0;
        }

        /* ================= NAVBAR ================= */

        nav {

            background: #ff6b6b;

            padding: 15px 8%;

            display: flex;

            justify-content: space-between;

            align-items: center;
        }

        nav h2 {
            color: white;
        }

        nav a {

            color: white;

            text-decoration: none;

            font-weight: bold;
        }

        /* ================= PAGE ================= */

        .page {

            max-width: 750px;

            margin: 60px auto;

            padding: 20px;
        }

        .title {

            text-align: center;

            color: #ff6b6b;

            margin-bottom: 30px;
        }

        /* ================= QUIZ BOX ================= */

        .quiz-box {

            background: white;

            padding: 35px;

            border-radius: 20px;

            box-shadow:
                0 8px 25px
                rgba(0,0,0,0.1);
        }

        /* ================= SUBJECT SELECTION ================= */

        .subject-selection {

            text-align: center;
        }

        .subject-selection h2 {

            color: #ff6b6b;

            margin-bottom: 10px;
        }

        .subject-selection p {

            color: #666;

            margin-bottom: 25px;
        }

        .subjects {

            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 15px;

            margin-bottom: 25px;
        }

        .subject-btn {

            padding: 18px;

            border: 2px solid #eee;

            background: white;

            border-radius: 15px;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;

            color: #444;
        }

        .subject-btn:hover {

            background: #fff1e6;

            border-color: #ff6b6b;

            transform: translateY(-2px);
        }

        .subject-btn.active {

            background: #ff6b6b;

            color: white;

            border-color: #ff6b6b;
        }

        #startQuizBtn {

            margin-top: 10px;

            padding: 13px 30px;

            border: none;

            border-radius: 25px;

            background: #ff6b6b;

            color: white;

            font-weight: bold;

            cursor: pointer;

            font-size: 16px;

            transition: 0.3s;
        }

        #startQuizBtn:hover {

            background: #ff5252;

            transform: translateY(-2px);
        }

        /* ================= QUIZ TOP ================= */

        .top {

            display: flex;

            justify-content:
                space-between;

            color: #ff6b6b;

            font-weight: bold;

            margin-bottom: 25px;
        }

        /* ================= QUESTION ================= */

        #question {

            margin-bottom: 25px;

            line-height: 1.5;
        }

        /* ================= OPTIONS ================= */

        #options {

            display: flex;

            flex-direction: column;

            gap: 12px;
        }

        .option {

            padding: 15px;

            border: 2px solid #eee;

            background: white;

            border-radius: 12px;

            text-align: left;

            cursor: pointer;

            font-size: 16px;
        }

        .option:hover {

            background: #fff1e6;

            border-color: #ff6b6b;
        }

        .option.correct {

            background: #d4edda;

            border-color: #28a745;
        }

        .option.wrong {

            background: #f8d7da;

            border-color: #dc3545;
        }

        /* ================= BUTTON ================= */

        .btn {

            margin-top: 25px;

            padding: 13px 25px;

            border: none;

            border-radius: 25px;

            background: #ff6b6b;

            color: white;

            font-weight: bold;

            cursor: pointer;
        }

        /* ================= RESULT ================= */

        .result {

            text-align: center;
        }

        .result h2 {

            color: #ff6b6b;

            margin: 15px;
        }

        /* ================= MOBILE ================= */

        @media(max-width:700px) {

            nav {

                flex-direction: column;

                gap: 12px;

                text-align: center;
            }

            .page {

                margin: 30px auto;

                padding: 15px;
            }

            .quiz-box {

                padding: 20px;
            }

            .subjects {

                grid-template-columns: 1fr;
            }

            .top {

                flex-direction: column;

                gap: 10px;

                text-align: center;
            }

        }

    </style>

</head>


<body>


    <!-- ================= NAVBAR ================= -->

    <nav>

        <h2>
            🌈 Maahi Ki Funshala
        </h2>

        <a href="games.html">
            🎮 Back to Games
        </a>

    </nav>


    <!-- ================= PAGE ================= -->

    <div class="page">

        <h1 class="title">
            🧠 Student Quiz
        </h1>


        <div
            class="quiz-box"
            id="quizBox">


            <!-- ================= SUBJECT SELECTION ================= -->

            <div
                class="subject-selection"
                id="subjectSelection">

                <h2>
                    📚 Choose Your Subject
                </h2>

                <p>
                    Select a subject to start your quiz.
                </p>


                <div class="subjects">

                    <button
                        class="subject-btn"
                        onclick="selectSubject('English', this)">

                        📘 English

                    </button>


                    <button
                        class="subject-btn"
                        onclick="selectSubject('Hindi', this)">

                        🪔 Hindi

                    </button>


                    <button
                        class="subject-btn"
                        onclick="selectSubject('Mathematics', this)">

                        🔢 Mathematics

                    </button>


                    <button
                        class="subject-btn"
                        onclick="selectSubject('Science', this)">

                        🔬 Science

                    </button>


                    <button
                        class="subject-btn"
                        onclick="selectSubject('Social Science', this)">

                        🌍 Social Science

                    </button>

                </div>


                <button
                    id="startQuizBtn"
                    onclick="beginSelectedQuiz()">

                    🚀 Start Quiz

                </button>

            </div>


            <!-- ================= QUIZ AREA ================= -->

            <div
                id="quizArea"
                style="display:none;">


                <div class="top">

                    <span id="questionNumber">
                        Question 1 / 10
                    </span>

                    <span id="score">
                        Score: 0
                    </span>

                </div>


                <h2 id="question">
                    Loading...
                </h2>


                <div id="options"></div>


                <button
                    class="btn"
                    id="nextBtn"
                    onclick="nextQuestion()"
                    style="display:none;">

                    Next Question ➡️

                </button>


            </div>


        </div>

    </div>


    <!-- ================= JAVASCRIPT ================= -->

    <script src="script.js"></script>


</body>

</html>
