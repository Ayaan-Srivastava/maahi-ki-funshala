<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Quiz - Maahi Ki Funshala</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Trebuchet MS", "Segoe UI", Arial, sans-serif;
        }

        body {
            min-height: 100vh;

            background:
                radial-gradient(
                    circle at top left,
                    #24183d 0%,
                    #111827 38%,
                    #090d16 100%
                );

            color: #eeeeee;
        }

        /* NAVBAR */

        nav {
            background: rgba(10, 13, 24, 0.94);
            border-bottom: 1px solid rgba(255,255,255,0.08);

            padding: 16px 8%;

            display: flex;
            justify-content: space-between;
            align-items: center;

            position: sticky;
            top: 0;
            z-index: 100;
        }

        nav h2 {
            color: white;
            font-size: 21px;
        }

        .nav-links {
            display: flex;
            gap: 10px;
        }

        .nav-links a {
            color: #d8d8df;
            text-decoration: none;
            font-weight: bold;

            padding: 9px 15px;
            border-radius: 10px;
        }

        .nav-links a:hover {
            background: #26203a;
            color: white;
        }

        /* PAGE */

        .page {
            max-width: 850px;
            margin: 55px auto;
            padding: 20px;
        }

        .title {
            text-align: center;
            color: #c084fc;
            margin-bottom: 30px;
            font-size: 34px;
        }

        /* QUIZ BOX */

        .quiz-box {
            background:
                linear-gradient(
                    145deg,
                    rgba(30,30,48,0.97),
                    rgba(17,24,39,0.98)
                );

            padding: 38px;
            border-radius: 22px;

            border: 1px solid rgba(255,255,255,0.08);

            box-shadow:
                0 20px 55px rgba(0,0,0,0.45);
        }

        /* SUBJECT */

        .subject-selection {
            text-align: center;
        }

        .subject-selection h2 {
            color: #f0abfc;
            margin-bottom: 10px;
        }

        .subject-selection p {
            color: #aaa;
            margin-bottom: 28px;
        }

        .subjects {
            display: grid;
            grid-template-columns: repeat(2,1fr);
            gap: 15px;
        }

        .subject-btn {
            padding: 20px 15px;

            border: 1px solid #35334a;
            background: #191827;
            color: #e7e7ed;

            border-radius: 15px;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
            transition: 0.25s;
        }

        .subject-btn:hover {
            background: #242039;
            border-color: #a855f7;
            transform: translateY(-3px);
        }

        .subject-btn.active {
            background:
                linear-gradient(
                    135deg,
                    #7c3aed,
                    #a855f7
                );

            color: white;
        }

        /* SCIENCE LEVEL */

        #scienceLevelSelection {
            display: none;

            margin-top: 28px;
            padding: 24px;

            background: #121322;
            border-radius: 16px;

            border: 1px solid #302d46;
        }

        #scienceLevelSelection h3 {
            color: #f0abfc;
            margin-bottom: 18px;
        }

        .science-levels {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .level-btn {
            padding: 12px 22px;

            border: 1px solid #3b394c;
            border-radius: 25px;

            background: #1b1a2a;
            color: #d9d9e2;

            font-weight: bold;
            cursor: pointer;
        }

        .level-btn:hover {
            border-color: #a855f7;
            background: #27213d;
        }

        .level-btn.active {
            background: #8b5cf6;
            color: white;
        }

        /* QUIZ */

        #quizArea {
            display: none;
        }

        .subject-label {
            text-align: center;
            margin-bottom: 20px;

            color: #f0abfc;
            font-weight: bold;
            font-size: 18px;
        }

        .top {
            display: flex;
            justify-content: space-between;

            color: #c084fc;
            font-weight: bold;

            margin-bottom: 25px;

            background: #111322;
            padding: 13px 16px;

            border-radius: 12px;
        }

        #question {
            margin-bottom: 25px;
            line-height: 1.6;

            color: #f3f3f5;
            font-size: 23px;
        }

        /* OPTIONS */

        #options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option {
            padding: 16px 18px;

            border: 1px solid #353449;
            background: #171725;

            color: #e5e5eb;

            border-radius: 13px;

            text-align: left;
            cursor: pointer;

            font-size: 16px;
        }

        .option:hover {
            background: #25203a;
            border-color: #a855f7;
        }

        .option.correct {
            background: #123524;
            border-color: #22c55e;
            color: #86efac;
        }

        .option.wrong {
            background: #3a171c;
            border-color: #ef4444;
            color: #fca5a5;
        }

        .option:disabled {
            cursor: not-allowed;
        }

        /* TIMER MESSAGE */

        #answerMessage {
            text-align: center;

            margin-top: 18px;

            min-height: 25px;

            font-weight: bold;
        }

        /* BUTTONS */

        .quiz-buttons {
            display: flex;
            justify-content: space-between;

            gap: 10px;
            flex-wrap: wrap;
        }

        .btn {
            margin-top: 25px;

            padding: 13px 22px;

            border: none;
            border-radius: 12px;

            background:
                linear-gradient(
                    135deg,
                    #7c3aed,
                    #a855f7
                );

            color: white;

            font-weight: bold;
            cursor: pointer;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* RESULT */

        .result {
            text-align: center;
        }

        .result h2 {
            color: #c084fc;
            margin: 15px;
        }

        .result-card {
            background: #111322;

            padding: 28px;
            border-radius: 16px;

            margin: 20px 0;

            border: 1px solid #302d46;
        }

        .result-card p {
            margin: 12px;
            color: #cfcfd8;
        }

        .result-score {
            font-size: 42px;
            font-weight: bold;
            color: #c084fc;
            margin: 18px;
        }

        /* MOBILE */

        @media(max-width:700px) {

            nav {
                flex-direction: column;
                gap: 12px;
                text-align: center;
            }

            .page {
                margin: 30px auto;
                padding: 14px;
            }

            .quiz-box {
                padding: 20px;
            }

            .subjects {
                grid-template-columns: 1fr;
            }

            .top {
                flex-direction: column;
                gap: 10px;
                text-align: center;
            }

            #question {
                font-size: 19px;
            }

            .quiz-buttons {
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }
        }

    </style>

</head>


<body>

<nav>

    <h2>🌈 Maahi Ki Funshala</h2>

    <div class="nav-links">

        <a href="index.html">🏠 Home</a>

        <a href="games.html">🎮 Games</a>

    </div>

</nav>


<div class="page">

    <h1 class="title">
        🧠 Student Quiz
    </h1>


    <div class="quiz-box">


        <!-- SUBJECT SELECTION -->

        <div
            class="subject-selection"
            id="subjectSelection">

            <h2>📚 Choose Your Subject</h2>

            <p>
                Select a subject and start your quiz!
            </p>


            <div class="subjects">

                <button
                    class="subject-btn"
                    onclick="selectSubject('English', this)">
                    📘 English
                    <small>(Grammar)</small>
                </button>


                <button
                    class="subject-btn"
                    onclick="selectSubject('Hindi', this)">
                    🪔 Hindi
                </button>


                <button
                    class="subject-btn"
                    onclick="selectSubject('Mathematics', this)">
                    🔢 Mathematics
                </button>


                <button
                    class="subject-btn"
                    onclick="selectSubject('Science', this)">
                    🔬 Science
                </button>


                <button
                    class="subject-btn"
                    onclick="selectSubject('Social Science', this)">
                    🌍 Social Science
                </button>


                <button
                    class="subject-btn"
                    onclick="selectSubject('General Studies', this)">
                    🌐 General Studies
                </button>

            </div>


            <!-- SCIENCE LEVEL -->

            <div id="scienceLevelSelection">

                <h3>🔬 Choose Science Level</h3>

                <div class="science-levels">

                    <button
                        class="level-btn"
                        onclick="selectScienceLevel('Easy', this)">
                        🟢 Easy
                    </button>

                    <button
                        class="level-btn"
                        onclick="selectScienceLevel('Medium', this)">
                        🟡 Medium
                    </button>

                    <button
                        class="level-btn"
                        onclick="selectScienceLevel('Hard', this)">
                        🔴 Hard
                    </button>

                </div>

            </div>

        </div>


        <!-- QUIZ AREA -->

        <div id="quizArea">

            <div
                class="subject-label"
                id="quizSubject">
                📚 Quiz
            </div>


            <div class="top">

                <span id="questionNumber">
                    Question 1 / 10
                </span>

                <span id="score">
                    Score: 0
                </span>

            </div>


            <h2 id="question">
                Loading...
            </h2>


            <div id="options"></div>


            <div id="answerMessage"></div>


            <div class="quiz-buttons">

                <button
                    class="btn"
                    id="prevBtn"
                    onclick="previousQuestion()">
                    ⬅️ Previous
                </button>


                <button
                    class="btn"
                    id="nextBtn"
                    onclick="nextQuestion()">
                    Next ➡️
                </button>

            </div>

        </div>

    </div>

</div>


<script src="script.js"></script>

</body>

</html>
