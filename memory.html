<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Memory Game - Maahi Ki Funshala</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#fff8f0;
}

/* NAVBAR */

nav{
    background:#ff6b6b;
    padding:15px 8%;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

nav h2,
nav a{
    color:white;
}

nav a{
    text-decoration:none;
    font-weight:bold;
}

/* PAGE */

.page{
    max-width:800px;
    margin:40px auto;
    padding:20px;
}

.title{
    text-align:center;
    color:#ff6b6b;
    margin-bottom:25px;
}

/* BOX */

.box{
    background:white;
    padding:30px;
    border-radius:20px;
    box-shadow:0 8px 25px rgba(0,0,0,.1);
}

/* INFO */

.info{
    display:flex;
    justify-content:space-between;
    color:#ff6b6b;
    font-weight:bold;
    margin-bottom:25px;
}

/* LEVEL */

.level{
    text-align:center;
    margin-bottom:15px;
    color:#555;
    font-weight:bold;
}

/* MESSAGE */

.message{
    text-align:center;
    font-size:20px;
    font-weight:bold;
    margin-bottom:20px;
}

/* MEMORY GRID */

.memory-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
    margin:25px 0;
}

.memory-item{
    background:#fff1e6;
    border:2px solid #ff6b6b;
    border-radius:15px;
    padding:20px 10px;
    text-align:center;
    font-size:38px;
    min-height:90px;
    display:flex;
    align-items:center;
    justify-content:center;
}

/* TIMER */

.timer{
    text-align:center;
    font-size:18px;
    font-weight:bold;
    color:#ff6b6b;
    margin:15px 0;
}

/* QUESTION */

#question{
    text-align:center;
    margin:20px 0;
    line-height:1.5;
}

/* OPTIONS */

.options{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

.option{
    padding:15px;
    border:2px solid #eee;
    border-radius:12px;
    background:white;
    cursor:pointer;
    font-size:16px;
    font-weight:bold;
}

.option:hover{
    border-color:#ff6b6b;
    background:#fff1e6;
}

.correct{
    background:#d4edda !important;
    border-color:#28a745 !important;
}

.wrong{
    background:#f8d7da !important;
    border-color:#dc3545 !important;
}

/* BUTTON */

.btn{
    padding:13px 25px;
    margin-top:25px;
    border:none;
    border-radius:25px;
    background:#ff6b6b;
    color:white;
    font-weight:bold;
    cursor:pointer;
    font-size:16px;
}

.btn:hover{
    background:#ff5252;
}

/* RESULT */

.result{
    text-align:center;
}

.result h2{
    color:#ff6b6b;
    margin:15px;
}

.result p{
    margin:10px;
    font-size:17px;
}

/* RESPONSIVE */

@media(max-width:700px){

    nav{
        flex-direction:column;
        gap:12px;
        text-align:center;
    }

    .page{
        margin:25px auto;
        padding:15px;
    }

    .box{
        padding:20px;
    }

    .info{
        flex-direction:column;
        gap:10px;
        text-align:center;
    }

    .memory-grid{
        grid-template-columns:repeat(2,1fr);
    }

    .options{
        grid-template-columns:1fr;
    }

    .memory-item{
        font-size:32px;
    }

}

</style>

</head>

<body>


<nav>

<h2>🌈 Maahi Ki Funshala</h2>

<a href="games.html">
🎮 Back to Games
</a>

</nav>


<div class="page">

<h1 class="title">
🧠 Memory Game
</h1>


<div class="box" id="box">

<div class="info">

<span>
Round:
<span id="round">1</span>/10
</span>

<span>
🏆 Score:
<span id="score">0</span>
</span>

</div>


<div class="level" id="level">
Level: Easy
</div>


<div class="message" id="message">
Remember these objects!
</div>


<div class="timer" id="timer">
Memorize: 5 seconds
</div>


<div class="memory-grid" id="memoryGrid"></div>


<div id="questionArea" style="display:none;">

<h2 id="question"></h2>

<div class="options" id="options"></div>

</div>


</div>

</div>


<script>


/* =========================
   MEMORY ITEMS
========================= */

const items = [

    "🍎",
    "🍌",
    "🍇",
    "🍉",
    "🍓",
    "🍒",
    "🍍",
    "🥝",
    "🥭",
    "🍊",

    "🐶",
    "🐱",
    "🐼",
    "🦁",
    "🐯",
    "🐸",
    "🐵",
    "🐰",
    "🦊",
    "🐨",

    "🚗",
    "🚲",
    "✈️",
    "🚀",
    "🚢",
    "🚌",
    "🚂",
    "🏍️",
    "🚁",
    "🚕",

    "⭐",
    "🌙",
    "☀️",
    "🌈",
    "⚽",
    "🏀",
    "🎸",
    "📚",
    "🎁",
    "🎈"

];


/* =========================
   GAME SETTINGS
========================= */

const levels = {

    easy:{
        count:4,
        time:5
    },

    medium:{
        count:6,
        time:4
    },

    hard:{
        count:8,
        time:3
    }

};


/* =========================
   VARIABLES
========================= */

let currentRound = 0;

let score = 0;

let levelName = "easy";

let selectedItems = [];

let correctAnswer = "";

let timerInterval;


/* =========================
   GET ELEMENTS
========================= */

const memoryGrid =
document.getElementById("memoryGrid");

const timer =
document.getElementById("timer");

const message =
document.getElementById("message");

const questionArea =
document.getElementById("questionArea");

const question =
document.getElementById("question");

const options =
document.getElementById("options");


/* =========================
   GET LEVEL
========================= */

function getLevel(){

    if(currentRound < 3){

        levelName = "easy";

    }
    else if(currentRound < 7){

        levelName = "medium";

    }
    else{

        levelName = "hard";

    }

}


/* =========================
   SHOW LEVEL
========================= */

function updateLevel(){

    let levelText =
    levelName.charAt(0).toUpperCase()
    + levelName.slice(1);

    document.getElementById("level")
    .innerText =
    "Level: " + levelText;

}


/* =========================
   RANDOM ITEMS
========================= */

function getRandomItems(count){

    let shuffled =
    [...items].sort(() => Math.random() - 0.5);

    return shuffled.slice(0,count);

}


/* =========================
   START ROUND
========================= */

function startRound(){

    clearInterval(timerInterval);

    getLevel();

    updateLevel();

    questionArea.style.display="none";

    memoryGrid.style.display="grid";

    message.innerText =
    "🧠 Remember these objects!";

    const settings =
    levels[levelName];

    selectedItems =
    getRandomItems(settings.count);


    /* SHOW ITEMS */

    memoryGrid.innerHTML="";

    selectedItems.forEach(item=>{

        const div =
        document.createElement("div");

        div.className="memory-item";

        div.innerText=item;

        memoryGrid.appendChild(div);

    });


    /* TIMER */

    let timeLeft =
    settings.time;

    timer.innerText =
    "Memorize: " + timeLeft + " seconds";


    timerInterval =
    setInterval(()=>{

        timeLeft--;

        timer.innerText =
        "Memorize: " + timeLeft + " seconds";


        if(timeLeft<=0){

            clearInterval(timerInterval);

            hideMemory();

        }

    },1000);

}


/* =========================
   HIDE MEMORY
========================= */

function hideMemory(){

    memoryGrid.style.display="none";

    timer.innerText="";

    message.innerText =
    "🤔 Now test your memory!";

    createQuestion();

}


/* =========================
   CREATE QUESTION
========================= */

function createQuestion(){

    questionArea.style.display="block";

    /*
       Randomly choose one of
       the remembered objects
    */

    correctAnswer =
    selectedItems[
        Math.floor(
            Math.random() * selectedItems.length
        )
    ];


    question.innerText =
    "Which of these objects was shown?";


    /*
       Create wrong options
    */

    let wrongOptions =
    items.filter(item =>
        !selectedItems.includes(item)
    );


    wrongOptions =
    wrongOptions
    .sort(() => Math.random() - 0.5)
    .slice(0,3);


    let allOptions =
    [correctAnswer,...wrongOptions]
    .sort(() => Math.random() - 0.5);


    options.innerHTML="";


    allOptions.forEach(option=>{

        let button =
        document.createElement("button");

        button.className="option";

        button.innerText=option;

        button.onclick=() =>
        checkAnswer(button,option);

        options.appendChild(button);

    });

}


/* =========================
   CHECK ANSWER
========================= */

function checkAnswer(button,answer){

    document
    .querySelectorAll(".option")
    .forEach(btn =>
        btn.disabled=true
    );


    if(answer === correctAnswer){

        button.classList.add("correct");

        score++;

        document.getElementById("score")
        .innerText=score;

    }

    else{

        button.classList.add("wrong");

        document
        .querySelectorAll(".option")
        .forEach(btn=>{

            if(btn.innerText === correctAnswer){

                btn.classList.add("correct");

            }

        });

    }


    setTimeout(()=>{

        currentRound++;

        document.getElementById("round")
        .innerText =
        Math.min(currentRound+1,10);


        if(currentRound < 10){

            startRound();

        }

        else{

            showResult();

        }

    },800);

}


/* =========================
   RESULT
========================= */

function showResult(){

    clearInterval(timerInterval);

    let percentage =
    Math.round(
        (score / 10) * 100
    );


    let messageText;


    if(score >= 9){

        messageText =
        "🧠 Amazing memory!";

    }

    else if(score >= 7){

        messageText =
        "🎉 Great memory!";

    }

    else if(score >= 5){

        messageText =
        "👍 Good job! Keep practicing!";

    }

    else{

        messageText =
        "💪 Keep practicing your memory!";

    }


    document.getElementById("box")
    .innerHTML = `

        <div class="result">

            <h2>🎉 Memory Game Completed!</h2>

            <h2>${score} / 10</h2>

            <p>Your Score: ${percentage}%</p>

            <p>${messageText}</p>

            <button
                class="btn"
                onclick="location.reload()">

                🔄 Play Again

            </button>

        </div>

    `;

}


/* =========================
   START GAME
========================= */

startRound();

</script>

</body>

</html>
