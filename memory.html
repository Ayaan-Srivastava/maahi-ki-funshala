
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Memory Game - Maahi Ki Funshala</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    min-height:100vh;
    background:
        radial-gradient(circle at top left,#24183d 0%,#111827 40%,#090d16 100%);
    color:#eeeeee;
}

/* ================= NAVBAR ================= */

nav{
    background:rgba(10,13,24,.95);
    border-bottom:1px solid rgba(255,255,255,.08);

    padding:16px 8%;

    display:flex;
    justify-content:space-between;
    align-items:center;

    box-shadow:0 5px 25px rgba(0,0,0,.35);

    position:sticky;
    top:0;
    z-index:100;
}

nav h2{
    color:#f5f5f5;
    font-size:21px;
}

nav a{
    color:#d8d8df;
    text-decoration:none;
    font-weight:bold;
    padding:9px 15px;
    border-radius:10px;
    transition:.25s;
}

nav a:hover{
    background:#26203a;
    color:white;
}

/* ================= PAGE ================= */

.page{
    max-width:850px;
    margin:45px auto;
    padding:20px;
}

.title{
    text-align:center;
    color:#c084fc;
    margin-bottom:30px;
    font-size:34px;
    text-shadow:0 0 20px rgba(192,132,252,.25);
}

/* ================= BOX ================= */

.box{
    background:
        linear-gradient(145deg,
        rgba(30,30,48,.97),
        rgba(17,24,39,.98));

    padding:35px;

    border-radius:22px;

    border:1px solid rgba(255,255,255,.08);

    box-shadow:0 20px 55px rgba(0,0,0,.45);
}

/* ================= INFO ================= */

.info{
    display:flex;
    justify-content:space-between;

    color:#c084fc;
    font-weight:bold;

    margin-bottom:25px;

    background:#111322;
    padding:13px 16px;

    border-radius:12px;
    border:1px solid #29283b;
}

/* ================= LEVEL ================= */

.level{
    text-align:center;
    margin-bottom:15px;

    color:#f0abfc;
    font-weight:bold;
    font-size:18px;
}

/* ================= MESSAGE ================= */

.message{
    text-align:center;

    font-size:20px;
    font-weight:bold;

    margin-bottom:18px;

    color:#f3f3f5;
}

/* ================= MEMORY GRID ================= */

.memory-grid{
    display:grid;

    grid-template-columns:repeat(4,1fr);

    gap:15px;

    margin:25px 0;
}

.memory-item{
    background:#191827;

    border:2px solid #35334a;

    border-radius:15px;

    padding:20px 10px;

    text-align:center;

    font-size:38px;

    min-height:90px;

    display:flex;
    align-items:center;
    justify-content:center;

    box-shadow:0 5px 15px rgba(0,0,0,.2);
}

/* ================= TIMER ================= */

.timer{
    text-align:center;

    font-size:18px;
    font-weight:bold;

    color:#c084fc;

    margin:15px 0;
}

/* ================= QUESTION ================= */

#question{
    text-align:center;

    margin:20px 0;

    line-height:1.5;

    color:#f3f3f5;

    font-size:22px;
}

/* ================= OPTIONS ================= */

.options{
    display:grid;

    grid-template-columns:1fr 1fr;

    gap:12px;
}

.option{
    padding:15px;

    border:2px solid #353449;

    border-radius:12px;

    background:#171725;

    color:#e5e5eb;

    cursor:pointer;

    font-size:16px;

    font-weight:bold;

    transition:.2s;
}

.option:hover{
    border-color:#a855f7;
    background:#25203a;
    transform:translateY(-2px);
}

.option:disabled{
    cursor:not-allowed;
}

.correct{
    background:#123524 !important;
    border-color:#22c55e !important;
    color:#86efac;
}

.wrong{
    background:#3a171c !important;
    border-color:#ef4444 !important;
    color:#fca5a5;
}

/* ================= BUTTON ================= */

.btn{
    padding:13px 25px;

    margin-top:25px;

    border:none;

    border-radius:12px;

    background:
        linear-gradient(135deg,#7c3aed,#a855f7);

    color:white;

    font-weight:bold;

    cursor:pointer;

    font-size:16px;

    transition:.25s;

    box-shadow:0 7px 20px rgba(124,58,237,.25);
}

.btn:hover{
    background:
        linear-gradient(135deg,#8b5cf6,#c084fc);

    transform:translateY(-2px);
}

/* ================= RESULT ================= */

.result{
    text-align:center;
}

.result h2{
    color:#c084fc;
    margin:15px;
}

.result p{
    margin:12px;
    font-size:17px;
    color:#cfcfd8;
}

.result-score{
    font-size:42px !important;
    font-weight:bold;
    color:#c084fc !important;
}

/* ================= MOBILE ================= */

@media(max-width:700px){

    nav{
        flex-direction:column;
        gap:12px;
        text-align:center;
    }

    .page{
        margin:25px auto;
        padding:15px;
    }

    .box{
        padding:20px;
    }

    .info{
        flex-direction:column;
        gap:10px;
        text-align:center;
    }

    .memory-grid{
        grid-template-columns:repeat(2,1fr);
    }

    .options{
        grid-template-columns:1fr;
    }

    .memory-item{
        font-size:32px;
    }

    #question{
        font-size:19px;
    }

    .btn{
        width:100%;
    }

}

</style>

</head>

<body>


<!-- ================= NAVBAR ================= -->

<nav>

    <h2>🌈 Maahi Ki Funshala</h2>

    <a href="games.html">
        🎮 Back to Games
    </a>

</nav>


<!-- ================= PAGE ================= -->

<div class="page">

    <h1 class="title">
        🧠 Memory Game
    </h1>


    <div class="box" id="box">


        <!-- ================= INFO ================= -->

        <div class="info">

            <span>
                Round:
                <span id="round">1</span>/10
            </span>

            <span>
                🏆 Score:
                <span id="score">0</span>
            </span>

        </div>


        <!-- ================= LEVEL ================= -->

        <div class="level" id="level">
            Level: Easy
        </div>


        <!-- ================= MESSAGE ================= -->

        <div class="message" id="message">
            🧠 Remember these objects!
        </div>


        <!-- ================= TIMER ================= -->

        <div class="timer" id="timer">
            Memorize: 5 seconds
        </div>


        <!-- ================= MEMORY GRID ================= -->

        <div
            class="memory-grid"
            id="memoryGrid">
        </div>


        <!-- ================= QUESTION ================= -->

        <div
            id="questionArea"
            style="display:none;">

            <h2 id="question"></h2>

            <div
                class="options"
                id="options">
            </div>

        </div>


    </div>

</div>


<script>

/* =====================================================
   MEMORY ITEMS
===================================================== */

const items = [

    "🍎",
    "🍌",
    "🍇",
    "🍉",
    "🍓",
    "🍒",
    "🍍",
    "🥝",
    "🥭",
    "🍊",

    "🐶",
    "🐱",
    "🐼",
    "🦁",
    "🐯",
    "🐸",
    "🐵",
    "🐰",
    "🦊",
    "🐨",

    "🚗",
    "🚲",
    "✈️",
    "🚀",
    "🚢",
    "🚌",
    "🚂",
    "🏍️",
    "🚁",
    "🚕",

    "⭐",
    "🌙",
    "☀️",
    "🌈",
    "⚽",
    "🏀",
    "🎸",
    "📚",
    "🎁",
    "🎈"

];


/* =====================================================
   LEVEL SETTINGS
===================================================== */

const levels = {

    easy:{
        count:4,
        time:5
    },

    medium:{
        count:6,
        time:4
    },

    hard:{
        count:8,
        time:3
    }

};


/* =====================================================
   VARIABLES
===================================================== */

let currentRound = 0;

let score = 0;

let levelName = "easy";

let selectedItems = [];

let correctAnswer = "";

let timerInterval;

let nextRoundTimeout;


/* =====================================================
   ELEMENTS
===================================================== */

const memoryGrid =
    document.getElementById("memoryGrid");

const timer =
    document.getElementById("timer");

const message =
    document.getElementById("message");

const questionArea =
    document.getElementById("questionArea");

const question =
    document.getElementById("question");

const options =
    document.getElementById("options");


/* =====================================================
   GET LEVEL
===================================================== */

function getLevel(){

    if(currentRound < 3){

        levelName = "easy";

    }

    else if(currentRound < 7){

        levelName = "medium";

    }

    else{

        levelName = "hard";

    }

}


/* =====================================================
   UPDATE LEVEL
===================================================== */

function updateLevel(){

    let levelText =
        levelName.charAt(0).toUpperCase()
        + levelName.slice(1);

    document.getElementById("level")
        .innerText =
        "Level: " + levelText;

}


/* =====================================================
   RANDOM ITEMS
===================================================== */

function getRandomItems(count){

    let shuffled =
        [...items].sort(() => Math.random() - 0.5);

    return shuffled.slice(0,count);

}


/* =====================================================
   START ROUND
===================================================== */

function startRound(){

    clearInterval(timerInterval);

    clearTimeout(nextRoundTimeout);

    getLevel();

    updateLevel();

    questionArea.style.display = "none";

    memoryGrid.style.display = "grid";

    message.innerText =
        "🧠 Remember these objects!";

    const settings =
        levels[levelName];

    selectedItems =
        getRandomItems(settings.count);


    /* SHOW OBJECTS */

    memoryGrid.innerHTML = "";

    selectedItems.forEach(item => {

        const div =
            document.createElement("div");

        div.className =
            "memory-item";

        div.innerText =
            item;

        memoryGrid.appendChild(div);

    });


    /* TIMER */

    let timeLeft =
        settings.time;

    timer.innerText =
        "Memorize: " + timeLeft + " seconds";


    timerInterval =
        setInterval(() => {

            timeLeft--;

            timer.innerText =
                "Memorize: " + timeLeft + " seconds";


            if(timeLeft <= 0){

                clearInterval(timerInterval);

                hideMemory();

            }

        },1000);

}


/* =====================================================
   HIDE MEMORY
===================================================== */

function hideMemory(){

    memoryGrid.style.display =
        "none";

    timer.innerText = "";

    message.innerText =
        "🤔 Now test your memory!";

    createQuestion();

}


/* =====================================================
   CREATE QUESTION
===================================================== */

function createQuestion(){

    questionArea.style.display =
        "block";


    /* SELECT CORRECT ANSWER */

    correctAnswer =
        selectedItems[
            Math.floor(
                Math.random() *
                selectedItems.length
            )
        ];


    question.innerText =
        "Which of these objects was shown?";


    /* WRONG OPTIONS */

    let wrongOptions =
        items.filter(item =>
            !selectedItems.includes(item)
        );


    wrongOptions =
        wrongOptions
            .sort(() => Math.random() - 0.5)
            .slice(0,3);


    /* ALL OPTIONS */

    let allOptions =
        [correctAnswer,...wrongOptions]
            .sort(() => Math.random() - 0.5);


    options.innerHTML = "";


    allOptions.forEach(option => {

        let button =
            document.createElement("button");

        button.className =
            "option";

        button.innerText =
            option;


        button.onclick =
            () => checkAnswer(button,option);


        options.appendChild(button);

    });

}


/* =====================================================
   CHECK ANSWER
===================================================== */

function checkAnswer(button,answer){

    /* PREVENT MULTIPLE CLICKS */

    document
        .querySelectorAll(".option")
        .forEach(btn => {

            btn.disabled = true;

        });


    /* CORRECT */

    if(answer === correctAnswer){

        button.classList.add("correct");

        score++;

        document.getElementById("score")
            .innerText = score;

        message.innerText =
            "✅ Correct!";

    }


    /* WRONG */

    else{

        button.classList.add("wrong");


        document
            .querySelectorAll(".option")
            .forEach(btn => {

                if(btn.innerText === correctAnswer){

                    btn.classList.add("correct");

                }

            });


        message.innerText =
            "❌ Wrong answer!";
    }


    /*
        WAIT 3 SECONDS
        THEN AUTOMATICALLY
        MOVE TO NEXT ROUND
    */

    nextRoundTimeout =
        setTimeout(() => {

            currentRound++;

            if(currentRound < 10){

                document.getElementById("round")
                    .innerText =
                    currentRound + 1;

                startRound();

            }

            else{

                showResult();

            }

        },3000);

}


/* =====================================================
   RESULT
===================================================== */

function showResult(){

    clearInterval(timerInterval);

    clearTimeout(nextRoundTimeout);


    let percentage =
        Math.round(
            (score / 10) * 100
        );


    let messageText;


    if(score >= 9){

        messageText =
            "🧠 Amazing memory!";

    }

    else if(score >= 7){

        messageText =
            "🎉 Great memory!";

    }

    else if(score >= 5){

        messageText =
            "👍 Good job! Keep practicing!";

    }

    else{

        messageText =
            "💪 Keep practicing your memory!";

    }


    document.getElementById("box")
        .innerHTML = `

        <div class="result">

            <h2>
                🎉 Memory Game Completed!
            </h2>

            <p class="result-score">
                ${score} / 10
            </p>

            <p>
                Your Score: ${percentage}%
            </p>

            <p>
                ${messageText}
            </p>

            <button
                class="btn"
                onclick="location.reload()">

                🔄 Play Again

            </button>

        </div>

    `;

}


/* =====================================================
   START GAME
===================================================== */

startRound();

</script>

</body>

</html>
