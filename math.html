<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Math Challenge - Maahi Ki Funshala</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:
        radial-gradient(
            circle at top left,
            rgba(139,92,246,.15),
            transparent 35%
        ),
        radial-gradient(
            circle at bottom right,
            rgba(236,72,153,.10),
            transparent 35%
        ),
        #0b0b12;

    color:#f5f5f7;
    min-height:100vh;
}

/* ================= NAVBAR ================= */

nav{
    background:rgba(17,17,26,.95);
    border-bottom:1px solid rgba(139,92,246,.25);

    padding:15px 8%;

    display:flex;
    justify-content:space-between;
    align-items:center;

    box-shadow:0 5px 25px rgba(0,0,0,.35);
}

nav h2{
    color:#ffffff;
}

nav a{
    color:#c4b5fd;
    text-decoration:none;
    font-weight:bold;

    transition:.3s;
}

nav a:hover{
    color:#f472b6;
}

/* ================= PAGE ================= */

.page{
    max-width:750px;
    margin:50px auto;
    padding:20px;
}

/* ================= TITLE ================= */

.title{
    text-align:center;
    color:#f472b6;

    margin-bottom:30px;

    text-shadow:
        0 0 18px rgba(244,114,182,.35);
}

/* ================= GAME BOX ================= */

.box{
    background:rgba(20,20,30,.92);

    padding:30px;

    border-radius:20px;

    border:1px solid rgba(139,92,246,.25);

    box-shadow:
        0 10px 35px rgba(0,0,0,.5),
        0 0 30px rgba(139,92,246,.08);

    backdrop-filter:blur(10px);
}

/* ================= LEVELS ================= */

.levels{
    display:flex;
    justify-content:center;
    gap:10px;
    flex-wrap:wrap;

    margin-bottom:25px;
}

.level{
    padding:12px 20px;

    border:1px solid #29293a;
    border-radius:20px;

    background:#11111a;
    color:#a1a1aa;

    font-weight:bold;

    cursor:pointer;

    transition:.3s;
}

.level.active,
.level:hover{
    background:linear-gradient(
        135deg,
        #8b5cf6,
        #ec4899
    );

    color:white;

    border-color:transparent;

    box-shadow:
        0 5px 15px rgba(139,92,246,.25);
}

/* ================= INFO ================= */

.info{
    display:flex;
    justify-content:space-around;

    color:#c4b5fd;

    font-weight:bold;

    margin-bottom:25px;
}

.info span span{
    color:#f472b6;

    text-shadow:
        0 0 8px rgba(244,114,182,.25);
}

/* ================= START AREA ================= */

#startArea p{
    color:#a1a1aa;
}

/* ================= QUESTION ================= */

#question{
    text-align:center;

    font-size:32px;

    margin:30px 0;

    color:#a78bfa;

    text-shadow:
        0 0 12px rgba(167,139,250,.35);
}

/* ================= OPTIONS ================= */

.options{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

.option{
    padding:15px;

    border:2px solid #29293a;
    border-radius:12px;

    background:#11111a;
    color:#f5f5f7;

    cursor:pointer;

    font-size:17px;

    transition:.25s;
}

.option:hover:not(:disabled){
    background:#191927;

    border-color:#8b5cf6;

    transform:translateY(-2px);

    box-shadow:
        0 5px 15px rgba(139,92,246,.15);
}

/* ================= CORRECT ================= */

.correct{
    background:rgba(34,197,94,.15) !important;

    border-color:#22c55e !important;

    color:#86efac !important;

    box-shadow:
        0 0 15px rgba(34,197,94,.15);
}

/* ================= WRONG ================= */

.wrong{
    background:rgba(239,68,68,.15) !important;

    border-color:#ef4444 !important;

    color:#fca5a5 !important;

    box-shadow:
        0 0 15px rgba(239,68,68,.12);
}

/* ================= BUTTON ================= */

.btn{
    padding:13px 25px;

    border:none;
    border-radius:25px;

    background:linear-gradient(
        135deg,
        #8b5cf6,
        #ec4899
    );

    color:white;

    font-weight:bold;

    cursor:pointer;

    margin-top:25px;

    box-shadow:
        0 5px 15px rgba(139,92,246,.25);

    transition:.3s;
}

.btn:hover{
    transform:translateY(-2px);

    box-shadow:
        0 8px 22px rgba(236,72,153,.3);
}

.btn:active{
    transform:scale(.97);
}

/* ================= RESULT ================= */

.result{
    text-align:center;
}

.result h2{
    color:#f472b6;

    margin:15px;

    text-shadow:
        0 0 12px rgba(244,114,182,.3);
}

.result p{
    color:#a1a1aa;
}

/* ================= MOBILE ================= */

@media(max-width:700px){

    nav{
        flex-direction:column;
        gap:12px;
        text-align:center;
    }

    .page{
        margin:25px auto;
        padding:15px;
    }

    .box{
        padding:20px;
    }

    .info{
        flex-direction:column;
        align-items:center;
        gap:10px;
    }

    .options{
        grid-template-columns:1fr;
    }

    #question{
        font-size:26px;
    }

    .level{
        padding:10px 16px;
    }

    .btn{
        width:100%;
    }

}

</style>
</head>

<body>

<nav>

<h2>🌈 Maahi Ki Funshala</h2>

<a href="games.html">
🎮 Back to Games
</a>

</nav>


<div class="page">

<h1 class="title">
🔢 Math Challenge
</h1>

<div class="box" id="gameBox">

<div class="levels">

<button class="level active"
onclick="selectLevel('easy',this)">
🟢 Easy
</button>

<button class="level"
onclick="selectLevel('medium',this)">
🟡 Medium
</button>

<button class="level"
onclick="selectLevel('hard',this)">
🔴 Hard
</button>

</div>


<div class="info">

<span>
⏱️ Time:
<span id="time">30</span>
</span>

<span>
🏆 Score:
<span id="score">0</span>
</span>

</div>


<div id="startArea" style="text-align:center">

<p>
Solve as many questions as you can!
</p>

<button class="btn"
onclick="startGame()">
🚀 Start Challenge
</button>

</div>


<div id="gameArea" style="display:none">

<h2 id="question"></h2>

<div class="options" id="options"></div>

</div>

</div>

</div>


<script>

let level = "easy";
let score = 0;
let time = 30;
let timer;
let currentAnswer;


function selectLevel(selected,button){

    level = selected;

    document.querySelectorAll(".level")
    .forEach(btn => btn.classList.remove("active"));

    button.classList.add("active");
}


function startGame(){

    clearInterval(timer);

    score = 0;
    time = 30;

    document.getElementById("score")
    .innerText = score;

    document.getElementById("time")
    .innerText = time;

    document.getElementById("startArea")
    .style.display = "none";

    document.getElementById("gameArea")
    .style.display = "block";

    generateQuestion();

    timer = setInterval(() => {

        time--;

        document.getElementById("time")
        .innerText = time;

        if(time <= 0){

            clearInterval(timer);
            finishGame();

        }

    },1000);
}


function generateQuestion(){

    let a,b,question;

    if(level === "easy"){

        a = Math.floor(Math.random()*20)+1;
        b = Math.floor(Math.random()*20)+1;

        let type = Math.floor(Math.random()*2);

        if(type === 0){

            question = `${a} + ${b}`;
            currentAnswer = a+b;

        }else{

            question = `${a} - ${b}`;
            currentAnswer = a-b;

        }

    }

    else if(level === "medium"){

        a = Math.floor(Math.random()*50)+1;
        b = Math.floor(Math.random()*20)+1;

        let type = Math.floor(Math.random()*3);

        if(type === 0){

            question = `${a} + ${b}`;
            currentAnswer = a+b;

        }
        else if(type === 1){

            question = `${a} - ${b}`;
            currentAnswer = a-b;

        }
        else{

            question = `${a} × ${b}`;
            currentAnswer = a*b;

        }

    }

    else{

        a = Math.floor(Math.random()*100)+1;
        b = Math.floor(Math.random()*20)+1;

        let type = Math.floor(Math.random()*4);

        if(type === 0){

            question = `${a} + ${b}`;
            currentAnswer = a+b;

        }
        else if(type === 1){

            question = `${a} - ${b}`;
            currentAnswer = a-b;

        }
        else if(type === 2){

            question = `${a} × ${b}`;
            currentAnswer = a*b;

        }
        else{

            a = b * (Math.floor(Math.random()*10)+1);

            question = `${a} ÷ ${b}`;
            currentAnswer = a/b;

        }
    }


    document.getElementById("question")
    .innerText = question;

    createOptions(currentAnswer);
}


function createOptions(answer){

    let options = [answer];

    while(options.length < 4){

        let random =
            answer +
            Math.floor(Math.random()*21)-10;

        if(!options.includes(random)){
            options.push(random);
        }
    }

    options.sort(() => Math.random()-0.5);

    let container =
        document.getElementById("options");

    container.innerHTML = "";

    options.forEach(option => {

        let button =
            document.createElement("button");

        button.className = "option";

        button.innerText = option;

        button.onclick = function(){

            if(option === currentAnswer){

                button.classList.add("correct");
                score++;

            }else{

                button.classList.add("wrong");

            }

            document.getElementById("score")
            .innerText = score;

            document.querySelectorAll(".option")
            .forEach(btn => btn.disabled = true);

            setTimeout(generateQuestion,500);

        };

        container.appendChild(button);

    });
}


function finishGame(){

    document.getElementById("gameBox").innerHTML = `

        <div class="result">

            <h2>🎉 Challenge Completed!</h2>

            <h2>🏆 Score: ${score}</h2>

            <p>
                Great job! Keep practicing mathematics.
            </p>

            <button class="btn"
            onclick="location.reload()">

            🔄 Play Again

            </button>

        </div>

    `;

}

</script>

</body>
</html>
