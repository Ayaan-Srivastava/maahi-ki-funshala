<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Word Scramble - Maahi Ki Funshala</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:
        radial-gradient(circle at top left, rgba(139,92,246,.15), transparent 35%),
        radial-gradient(circle at bottom right, rgba(236,72,153,.10), transparent 35%),
        #0b0b12;
    color:#f5f5f7;
    min-height:100vh;
}

/* NAVBAR */

nav{
    background:rgba(17,17,26,.95);
    border-bottom:1px solid rgba(139,92,246,.25);
    padding:15px 8%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    box-shadow:0 5px 25px rgba(0,0,0,.35);
}

nav h2{
    color:#ffffff;
}

nav a{
    color:#c4b5fd;
    text-decoration:none;
    font-weight:bold;
    transition:.3s;
}

nav a:hover{
    color:#f472b6;
}

/* PAGE */

.page{
    max-width:700px;
    margin:50px auto;
    padding:20px;
}

/* TITLE */

.title{
    text-align:center;
    color:#f472b6;
    margin-bottom:30px;
    text-shadow:0 0 18px rgba(244,114,182,.35);
}

/* GAME BOX */

.box{
    background:rgba(20,20,30,.92);
    padding:35px;
    border-radius:20px;
    text-align:center;

    border:1px solid rgba(139,92,246,.25);

    box-shadow:
        0 10px 35px rgba(0,0,0,.5),
        0 0 30px rgba(139,92,246,.08);

    backdrop-filter:blur(10px);
}

/* SCORE + TIMER */

.info{
    display:flex;
    justify-content:space-around;
    color:#c4b5fd;
    font-weight:bold;
}

.info span span{
    color:#f472b6;
}

/* SCRAMBLED WORD */

#scrambled{
    font-size:35px;
    color:#a78bfa;
    letter-spacing:5px;
    margin:30px 0;

    text-shadow:
        0 0 10px rgba(167,139,250,.4),
        0 0 25px rgba(167,139,250,.15);
}

/* DESCRIPTION */

.box > p:not(#message){
    color:#a1a1aa;
}

/* INPUT */

input{
    width:100%;
    padding:15px;

    background:#11111a;
    color:#ffffff;

    border:2px solid #29293a;
    border-radius:12px;

    font-size:17px;
    outline:none;

    transition:.3s;
}

input::placeholder{
    color:#71717a;
}

input:focus{
    border-color:#8b5cf6;

    box-shadow:
        0 0 0 3px rgba(139,92,246,.12),
        0 0 15px rgba(139,92,246,.15);
}

/* BUTTONS */

.btn{
    padding:13px 25px;
    margin-top:20px;

    border:none;
    border-radius:25px;

    background:linear-gradient(
        135deg,
        #8b5cf6,
        #ec4899
    );

    color:white;
    font-weight:bold;

    cursor:pointer;

    box-shadow:
        0 5px 15px rgba(139,92,246,.25);

    transition:.3s;
}

.btn:hover{
    transform:translateY(-2px);

    box-shadow:
        0 8px 22px rgba(236,72,153,.3);
}

.btn:active{
    transform:scale(.97);
}

/* MESSAGE */

#message{
    margin-top:20px;
    font-weight:bold;
    color:#f472b6;
    min-height:22px;
}

/* MOBILE */

@media(max-width:700px){

    nav{
        flex-direction:column;
        gap:12px;
        text-align:center;
    }

    .page{
        margin:25px auto;
        padding:15px;
    }

    .box{
        padding:25px 18px;
    }

    #scrambled{
        font-size:27px;
        letter-spacing:3px;
    }

    .info{
        flex-direction:column;
        gap:10px;
    }

    .btn{
        width:100%;
    }

}

</style>
</head>

<body>

<nav>

<h2>🌈 Maahi Ki Funshala</h2>

<a href="games.html">
🎮 Back to Games
</a>

</nav>


<div class="page">

<h1 class="title">
🔤 Word Scramble
</h1>

<div class="box">

<div class="info">

<span>
🏆 Score: <span id="score">0</span>
</span>

<span>
⏱️ Time: <span id="time">60</span>
</span>

</div>

<h2 id="scrambled">
CLICK START
</h2>

<p>
Unscramble the letters and find the correct word!
</p>

<input
id="answer"
placeholder="Type your answer..."
disabled>

<br>

<button
class="btn"
onclick="startGame()">
🚀 Start Game
</button>

<button
class="btn"
onclick="checkAnswer()">
✅ Submit
</button>

<p id="message"></p>

</div>

</div>


<script>

const words = [

"school",
"teacher",
"student",
"science",
"computer",
"keyboard",
"planet",
"library",
"mathematics",
"language",
"knowledge",
"education",
"programming",
"javascript",
"python"

];

let currentWord="";
let score=0;
let time=60;
let timer;


function shuffleWord(word){

    return word
        .split("")
        .sort(() => Math.random()-0.5)
        .join("");
}


function startGame(){

    clearInterval(timer);

    score=0;
    time=60;

    document.getElementById("score").innerText=score;
    document.getElementById("time").innerText=time;

    document.getElementById("answer").disabled=false;

    document.getElementById("answer").value="";

    document.getElementById("message").innerText="";

    newWord();

    timer=setInterval(()=>{

        time--;

        document.getElementById("time").innerText=time;

        if(time<=0){

            clearInterval(timer);

            document.getElementById("answer").disabled=true;

            document.getElementById("message")
            .innerText=
            `⏰ Time's Up! Final Score: ${score}`;

        }

    },1000);
}


function newWord(){

    currentWord =
    words[Math.floor(Math.random()*words.length)];

    document.getElementById("scrambled")
    .innerText =
    shuffleWord(currentWord);

    document.getElementById("answer").value="";
}


function checkAnswer(){

    if(time<=0) return;

    let answer =
    document.getElementById("answer")
    .value
    .trim()
    .toLowerCase();

    if(answer === currentWord){

        score++;

        document.getElementById("score")
        .innerText=score;

        document.getElementById("message")
        .innerText="🎉 Correct!";

        setTimeout(newWord,500);

    }else{

        document.getElementById("message")
        .innerText="❌ Try Again!";
    }
}

</script>

</body>
</html>
