
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Typing Test - Maahi Ki Funshala</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Trebuchet MS","Segoe UI",Arial,sans-serif;
}

body{
    min-height:100vh;
    background:
        radial-gradient(circle at top left,#24183d 0%,#111827 40%,#090d16 100%);
    color:#eeeeee;
}

/* ================= NAVBAR ================= */

nav{
    background:rgba(10,13,24,.95);
    border-bottom:1px solid rgba(255,255,255,.08);
    padding:16px 8%;

    display:flex;
    justify-content:space-between;
    align-items:center;

    position:sticky;
    top:0;
    z-index:100;

    box-shadow:0 5px 25px rgba(0,0,0,.35);
}

nav h2{
    color:#f5f5f5;
}

nav a{
    color:#d8d8df;
    text-decoration:none;
    font-weight:bold;
    padding:9px 15px;
    border-radius:10px;
    transition:.25s;
}

nav a:hover{
    background:#26203a;
    color:white;
}

/* ================= PAGE ================= */

.page{
    max-width:900px;
    margin:50px auto;
    padding:20px;
}

.title{
    text-align:center;
    color:#c084fc;
    margin-bottom:30px;
    font-size:34px;
    text-shadow:0 0 20px rgba(192,132,252,.25);
}

/* ================= BOX ================= */

.typing-box{
    background:
        linear-gradient(145deg,
        rgba(30,30,48,.97),
        rgba(17,24,39,.98));

    padding:35px;
    border-radius:22px;

    border:1px solid rgba(255,255,255,.08);

    box-shadow:
        0 20px 55px rgba(0,0,0,.45);
}

/* ================= LEVELS ================= */

.levels{
    display:flex;
    justify-content:center;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:20px;
}

.level-btn{
    padding:11px 17px;

    border:1px solid #35334a;
    border-radius:20px;

    background:#191827;
    color:#d9d9e2;

    font-weight:bold;
    cursor:pointer;

    transition:.25s;
}

.level-btn:hover{
    background:#27213d;
    border-color:#a855f7;
    transform:translateY(-2px);
}

.level-btn.active{
    background:linear-gradient(135deg,#7c3aed,#a855f7);
    border-color:#c084fc;
    color:white;
}

/* ================= LEVEL NAME ================= */

#levelName{
    text-align:center;
    color:#f0abfc;
    margin-bottom:22px;
    font-size:20px;
}

/* ================= INFO ================= */

.info{
    display:flex;
    justify-content:space-around;
    gap:15px;

    margin-bottom:25px;
}

.info span{
    background:#111322;

    border:1px solid #29283b;

    padding:12px 18px;

    border-radius:12px;

    color:#c084fc;

    font-weight:bold;

    min-width:120px;
    text-align:center;
}

/* ================= TEXT ================= */

.text{
    background:#111322;

    border:1px solid #302d46;

    padding:22px;

    border-radius:14px;

    line-height:1.8;

    margin-bottom:20px;

    min-height:110px;

    color:#e5e5eb;

    font-size:17px;
}

/* ================= TEXTAREA ================= */

textarea{
    width:100%;
    height:170px;

    padding:16px;

    font-size:17px;

    background:#0f111d;
    color:#eeeeee;

    border:2px solid #353449;

    border-radius:13px;

    resize:vertical;

    outline:none;

    transition:.25s;
}

textarea::placeholder{
    color:#777789;
}

textarea:focus{
    border-color:#a855f7;

    box-shadow:
        0 0 0 3px rgba(168,85,247,.12);
}

/* ================= BUTTON ================= */

.buttons{
    display:flex;
    justify-content:center;
    gap:12px;
    flex-wrap:wrap;
}

.btn{
    margin-top:20px;

    padding:13px 25px;

    border:none;
    border-radius:12px;

    background:
        linear-gradient(135deg,#7c3aed,#a855f7);

    color:white;

    font-weight:bold;

    cursor:pointer;

    transition:.25s;
}

.btn:hover{
    transform:translateY(-2px);

    box-shadow:
        0 8px 22px rgba(168,85,247,.3);
}

#submitBtn{
    background:
        linear-gradient(135deg,#15803d,#22c55e);

    display:none;
}

#submitBtn:hover{
    background:
        linear-gradient(135deg,#16a34a,#4ade80);
}

#resetBtn{
    background:#25243a;
}

#resetBtn:hover{
    background:#35334a;
}

/* ================= RESULT ================= */

#typingResult{
    text-align:center;

    margin-top:25px;

    line-height:1.9;

    color:#d9d9e2;
}

.result-title{
    color:#c084fc;
    font-size:27px;
    margin-bottom:15px;
}

.result-score{
    font-size:38px;
    color:#f0abfc;
    font-weight:bold;
    margin:15px;
}

.result-message{
    color:#a9a9b5;
}

/* ================= MOBILE ================= */

@media(max-width:700px){

    nav{
        flex-direction:column;
        gap:12px;
        text-align:center;
    }

    .page{
        margin:30px auto;
        padding:14px;
    }

    .typing-box{
        padding:20px;
    }

    .title{
        font-size:28px;
    }

    .info{
        flex-direction:column;
        align-items:stretch;
    }

    .info span{
        width:100%;
    }

    .level-btn{
        font-size:13px;
        padding:9px 13px;
    }

    textarea{
        height:150px;
    }

    .btn{
        width:100%;
    }

}

</style>

</head>

<body>


<!-- ================= NAVBAR ================= -->

<nav>

    <h2>
        🌈 Maahi Ki Funshala
    </h2>

    <a href="games.html">
        🎮 Back to Games
    </a>

</nav>


<!-- ================= PAGE ================= -->

<div class="page">

    <h1 class="title">
        ⌨️ Typing Speed Test
    </h1>


    <div class="typing-box">


        <!-- ================= LEVELS ================= -->

        <div class="levels">

            <button
                class="level-btn active"
                onclick="selectLevel(1,this)">
                🟢 Level 1
            </button>

            <button
                class="level-btn"
                onclick="selectLevel(2,this)">
                🟡 Level 2
            </button>

            <button
                class="level-btn"
                onclick="selectLevel(3,this)">
                🟠 Level 3
            </button>

            <button
                class="level-btn"
                onclick="selectLevel(4,this)">
                🔴 Level 4
            </button>

            <button
                class="level-btn"
                onclick="selectLevel(5,this)">
                🟣 Level 5
            </button>

        </div>


        <!-- ================= LEVEL NAME ================= -->

        <h3 id="levelName">
            🟢 Easy
        </h3>


        <!-- ================= INFO ================= -->

        <div class="info">

            <span>
                ⏱️
                <span id="time">30</span>
                sec
            </span>

            <span>
                ⚡
                <span id="wpm">0</span>
                WPM
            </span>

            <span>
                🎯
                <span id="accuracy">100</span>
                %
            </span>

        </div>


        <!-- ================= TEXT ================= -->

        <div
            class="text"
            id="typingText">

            Select a level and click
            <b>Start Test</b> to begin!

        </div>


        <!-- ================= INPUT ================= -->

        <textarea
            id="typingInput"
            placeholder="Your typing starts here..."
            disabled></textarea>


        <!-- ================= BUTTONS ================= -->

        <div class="buttons">

            <button
                class="btn"
                id="startBtn"
                onclick="startTypingTest()">

                🚀 Start Test

            </button>


            <button
                class="btn"
                id="resetBtn"
                onclick="resetTypingTest()">

                🔄 Reset

            </button>


            <button
                class="btn"
                id="submitBtn"
                onclick="submitTypingTest()">

                ✅ Submit Test

            </button>

        </div>


        <!-- ================= RESULT ================= -->

        <div id="typingResult"></div>


    </div>

</div>


<script>

/* =========================================
   TYPING TEXTS
========================================= */

const typingLevels = {

    1:{
        name:"🟢 Easy",
        time:30,
        text:
        "Learning is a journey. Practice every day and keep improving your skills."
    },

    2:{
        name:"🟡 Beginner",
        time:30,
        text:
        "Good typing speed comes with regular practice. Stay focused and type carefully."
    },

    3:{
        name:"🟠 Medium",
        time:30,
        text:
        "Technology has changed the way we learn, communicate and solve problems in our daily lives."
    },

    4:{
        name:"🔴 Hard",
        time:30,
        text:
        "Programming teaches us how to break a complex problem into smaller steps and solve each part logically."
    },

    5:{
        name:"🟣 Expert",
        time:30,
        text:
        "Consistent practice, patience and concentration can help students develop strong technical skills and confidence."

    }

};


/* =========================================
   VARIABLES
========================================= */

let selectedLevel = 1;

let timeLeft = 30;

let timerInterval = null;

let testStarted = false;

let startTime = null;


/* =========================================
   ELEMENTS
========================================= */

const typingText =
document.getElementById("typingText");

const typingInput =
document.getElementById("typingInput");

const timeDisplay =
document.getElementById("time");

const wpmDisplay =
document.getElementById("wpm");

const accuracyDisplay =
document.getElementById("accuracy");

const levelName =
document.getElementById("levelName");

const startBtn =
document.getElementById("startBtn");

const submitBtn =
document.getElementById("submitBtn");

const typingResult =
document.getElementById("typingResult");


/* =========================================
   SELECT LEVEL
========================================= */

function selectLevel(level,button){

    if(testStarted){
        return;
    }

    selectedLevel = level;

    document
    .querySelectorAll(".level-btn")
    .forEach(btn =>
        btn.classList.remove("active")
    );

    button.classList.add("active");

    levelName.innerText =
    typingLevels[level].name;

    timeLeft =
    typingLevels[level].time;

    timeDisplay.innerText =
    timeLeft;

    typingText.innerText =
    "Click Start Test to begin!";

    typingInput.value = "";

    typingInput.disabled = true;

    wpmDisplay.innerText = "0";

    accuracyDisplay.innerText = "100";

    typingResult.innerHTML = "";

}


/* =========================================
   START TEST
========================================= */

function startTypingTest(){

    if(testStarted){
        return;
    }

    const level =
    typingLevels[selectedLevel];

    testStarted = true;

    timeLeft = level.time;

    timeDisplay.innerText = timeLeft;

    typingText.innerText = level.text;

    typingInput.value = "";

    typingInput.disabled = false;

    typingInput.focus();

    typingResult.innerHTML = "";

    startBtn.style.display = "none";

    submitBtn.style.display = "inline-block";

    startTime = Date.now();


    /* TIMER */

    timerInterval =
    setInterval(() => {

        timeLeft--;

        timeDisplay.innerText =
        timeLeft;

        updateStats();


        if(timeLeft <= 0){

            clearInterval(timerInterval);

            submitTypingTest();

        }

    },1000);

}


/* =========================================
   UPDATE STATS
========================================= */

function updateStats(){

    const typed =
    typingInput.value;

    const target =
    typingLevels[selectedLevel].text;


    /* ACCURACY */

    let correctCharacters = 0;

    for(
        let i = 0;
        i < typed.length && i < target.length;
        i++
    ){

        if(typed[i] === target[i]){
            correctCharacters++;
        }

    }


    let accuracy = 100;

    if(typed.length > 0){

        accuracy =
        Math.round(
            (correctCharacters / typed.length) * 100
        );

    }


    accuracy =
    Math.max(0,Math.min(100,accuracy));


    accuracyDisplay.innerText =
    accuracy;


    /* WPM */

    const elapsedSeconds =
    Math.max(
        1,
        (Date.now() - startTime) / 1000
    );


    const words =
    typed.length / 5;


    const wpm =
    Math.round(
        words / (elapsedSeconds / 60)
    );


    wpmDisplay.innerText =
    wpm;

}


/* =========================================
   INPUT EVENT
========================================= */

typingInput.addEventListener(
    "input",
    function(){

        if(!testStarted){
            return;
        }

        updateStats();

        const target =
        typingLevels[selectedLevel].text;

        /*
           Automatically finish when
           complete text is typed
        */

        if(
            typingInput.value.length >=
            target.length
        ){

            submitTypingTest();

        }

    }
);


/* =========================================
   SUBMIT TEST
========================================= */

function submitTypingTest(){

    if(!testStarted){
        return;
    }

    clearInterval(timerInterval);

    updateStats();

    testStarted = false;

    typingInput.disabled = true;

    submitBtn.style.display = "none";

    startBtn.style.display = "inline-block";


    const finalWPM =
    parseInt(wpmDisplay.innerText);

    const finalAccuracy =
    parseInt(accuracyDisplay.innerText);


    let message = "";


    if(finalAccuracy >= 95 && finalWPM >= 40){

        message =
        "🔥 Excellent! Your typing is very strong.";

    }
    else if(finalAccuracy >= 90 && finalWPM >= 30){

        message =
        "🎉 Great job! Keep practicing.";

    }
    else if(finalAccuracy >= 80){

        message =
        "👍 Good attempt! Focus on accuracy and speed.";

    }
    else{

        message =
        "💪 Keep practicing. You will improve!";

    }


    typingResult.innerHTML = `

        <div class="result-title">
            🎉 Test Completed!
        </div>

        <div class="result-score">
            ${finalWPM} WPM
        </div>

        <p>
            🎯 Accuracy:
            <b>${finalAccuracy}%</b>
        </p>

        <p class="result-message">
            ${message}
        </p>

    `;

}


/* =========================================
   RESET
========================================= */

function resetTypingTest(){

    clearInterval(timerInterval);

    testStarted = false;

    const level =
    typingLevels[selectedLevel];

    timeLeft =
    level.time;

    timeDisplay.innerText =
    timeLeft;

    wpmDisplay.innerText =
    "0";

    accuracyDisplay.innerText =
    "100";

    typingText.innerText =
    "Click Start Test to begin!";

    typingInput.value = "";

    typingInput.disabled = true;

    typingResult.innerHTML = "";

    startBtn.style.display = "inline-block";

    submitBtn.style.display = "none";

}

</script>

</body>

</html>
